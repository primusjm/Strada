achievements:
  caption: Milestones
  title: Our Achievements
intro:
- We have worked with over 130 leaders from 14 national and regional organizations and initiatives, three community-based organizations, and four networks in Kenya, Tanzania, and Uganda across three different CRLI cohorts.
- We integrate a gender lens in our programming, and strive to ensure that at least 50% of our enrolled leaders are women. At present 60% of our graduates are women. We are proud of the ways that our support to leaders has led to meaningful change within the leader and their organization.
- 40% of our CRLI participants report having never received leadership training before attending CRLI, and 75% report having never worked with a leadership or career coach before. CRLI's work on leadership coaching is filling an important felt need for leaders.
- 'After graduating from CRLI, leaders report:'
items:
- title: Enhanced Leadership Capacity
  text: Leaders developed greater self-awareness through structured reflection, coaching, and peer learning. They identified their personal strengths, blind spots, and behavioral patterns, supporting their desired leadership transformation.
- title: Renewed Clarity of Purpose
  text: Organizations demonstrated an improved ability to recognize gaps between their existing practices and their ideal approach to fulfilling their mission.
- title: Improved Team Dynamics and Collaboration
  text: Leaders embraced consultative decision-making, built trust, and fostered a culture of open communication, resulting in stronger team cohesion and alignment with organizational goals.
- title: Organizational Transformation
  text: Participating organizations made systemic shifts and identified steps needed for transformation. This includes strengthening group dynamics, implementing wellness initiatives, adopting inclusive communication frameworks, and establishing participatory decision-making structures.
- title: Greater Self-Awareness and Willingness to Make Change
  text: Self-awareness opened a new world to participants and fostered openness to growth, empathy, and reflection. This shift led to consultative decision-making, improved communication, and a psychologically safe team environment, fostering collective problem-solving, shared accountability, and increased productivity.
- title: Improved Work-Life Balance
  text: Leaders who have completed CRLI report using more of their time off, having better time management, and disconnecting more from work because they trust their colleagues more. With their additional time, leaders are taking better care of their physical, mental, and spiritual wellbeing, in addition to prioritizing time with family.
