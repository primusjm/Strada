  lead: 'The nine-month coaching and development agenda for CRLI includes:'
  items:
  - Individual self-assessment
  - Organizational assessments
  - Two in-person meetings
  - Individual, team, and organizational coaching by certified coaches
  - Creation and implementation of Organizational Transformational Action Plans
