intro_left: CRLI is structured around the belief that leaders are only as strong as the team that surrounds them and that leaders grow best through connection with others. In CRLI, leaders and their organizations explore how to better serve their communities by bettering themselves and their organizations. CRLI is grounded in the principle that leadership is a collective effort and a practice.
intro_right: Leaders accepted into the CRLI program gain access to a space of self-reflection, allowing them to better know themselves – their strengths, opportunities for growth, and tendencies. They work in learning partnership groups based to create a culture of vulnerability, connection, and growth. Leaders and their organizations are accompanied on this journey by trained coaches who support their learning, growth, and development.
topics: Hand-selected experts skilled in special areas of interest help demystify various aspects of organizational leadership. Topics addressed in CRLI are co-created and selected by individuals and organizations to address specific challenges faced daily. For example, cohorts have explored emotional intelligence, ubuntu, gender, wellness, and how to become the leader Africa needs in crisis.
location: Currently, all organizations participating in CRLI are rooted in East Africa and focus on quality education, girls’ education, marginalized communities, or community development. We have a plan to expand to other countries and regions over time.
