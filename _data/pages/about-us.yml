founder:
  caption: How It Started
  title: Our Founder
  intro:
  - As an academic, researcher, funder, board member, and program manager, Dr. Joyce Malombe has collaborated with over <b>250</b> NGOs in the last <b>25</b> years across more than <b>30</b> countries, cementing her belief in the importance of leadership and coaching as a pathway to change communities.
  image_alt: Portrait of Dr. Joyce Malombe, founder
  left:
  - Joyce has over 25 years of experience working to advance community leadership on complex social challenges. She has worked as an academic researcher in the urban informal settlements of Nairobi, Kenya, as well as with pastoralist communities on water.
  - She designed Southern New Hampshire University’s International Community Development Program and led research at the World Bank on community foundations. She has worked for the Ford Foundation, Elma Philanthropies, and Wellspring Philanthropic Fund in global education, early childhood development, and social justice leadership.
  - Her experiences launching and supporting the Regional Education Learning Initiative, an education-focused network of changemakers in East Africa, transformed her thinking about leadership, social impact, self-awareness, and community, leading to her pursuit of becoming a coach for others.
  right:
  - 'Working together with leaders over the course of her career, Joyce saw how passion and desire weren’t enough to create change: leaders needed deeper, more personalized support to think bigger about pathways to creating change.'
  - She founded <b>Rising Leaders Center</b> in <b>2023</b> to provide this support to leaders. Today, as a Certified Master Coach, Joyce works with locally-rooted organizations and networks globally, especially in East Africa. She facilitates organizational change and transformation in her clients and partners. She deeply enjoys working with young, emerging leaders and local organizations.
  - Dr. Joyce Malombe is a <b>Certified Integral Master Coach,</b> a <b>Certified Enneagram Practitioner,</b> a <b>Certified Enterprise Coach,</b> and an <b>Integral Systems Coach.</b> She has a PhD in Urban Planning from University of Western Ontario. Her background in academia, research, philanthropy, program management and coaching uniquely equips her to understand and meet the needs of her clients.
  connect: Connect with Joyce on
  linkedin: LinkedIn
  image: /assets/images/about/joyce.webp
