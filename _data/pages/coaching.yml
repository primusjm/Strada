lead: We use Integral Coaching to help leaders and organizations grow from the inside out by deepening their self-awareness, aligning with their values, developing new skills, instilling balance across all areas of their lives, and building their capacity to lead transformational change.
body: Integral Coaching is different from other types of coaching because it honors the individual to create and instill balance within individuals, their teams, and their communities. Coaching is not a quick fix to our challenges as leaders, it’s a powerful, long-term investment in ourselves, our leadership, and our community. In coaching, a person works with a trained, certified coach who helps them to tackle personal and professional challenges in order to rise to become their best self.
right:
- By looking through a multitude of lenses and working to better understand ourselves, our eyes and hearts open to new ways of looking, feeling, connecting, and leading.
- 'For instance, a CRL coach might guide you through:'
bullets:
- Understanding systems and their dynamics.
- Clarifying your leadership identity, tendencies, and values.
- Prioritizing wellness and sustainability.
- Strengthening organizational culture and impact strategies.
image_alt: Participants taking notes around a table during a coaching session
closing: We have experience working with clients from a wide variety of countries and cultural contexts including the UK, Brazil, Canada, East Africa, and South Africa. We are currently accepting a limited number of new clients. Reach out to us today to determine if we are a good fit for you and your goals!
button: Get Started
