<!-- Share: system share sheet on phones, otherwise copies the link (assets/js/share.js) -->
<button type="button" class="btn btn-clear inline-flex items-center justify-center whitespace-nowrap py-2.5 md:py-2 green font-medium" data-share data-title="{{ include.title }}">
    <span class="btn-icon btn-icon-left pr-2">
        {% include icon.html icon="link" %}
    </span>
    <span class="btn-label" data-share-label>{{ site.data.pages.shared.article.share }}</span>
</button>
<span class="sr-only" role="status" aria-live="polite" data-share-status></span>
<script src="/assets/js/share.js?v={{ site.time | date: '%s' }}" defer></script>
