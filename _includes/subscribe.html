{% assign t = site.data.pages.shared %}
<div class="bg-cream">
  <div class="w-full max-w-[1200px] mx-auto px-4 lg:px-8 py-12">
    <div id="subscribeForm" class="titolo flex flex-col md:flex-row items-center justify-center gap-6 md:gap-8">
      <div class="flex-1 min-w-0 flex flex-col gap-4 text-center md:text-left text-charcoal">
        <h2 class="subscribe-heading">{{ t.subscribe.heading }}</h2>
        <p class="text-xl leading-[1.6]">{{ t.subscribe.text }}</p>
      </div>
      <!-- FORM -->
      <form class="w-full md:w-auto md:flex-none" action="https://formspree.io/f/xyzndyrb" method="POST" enctype="multipart/form-data" name="subscribe" novalidate data-form data-sending="{{ t.forms.sending }}" data-failed="{{ t.forms.failed }}" data-check="{{ t.forms.check_field }}" data-hide-id="subscribeForm" data-success-id="submitSubscribeForm">
        <div class="flex flex-col sm:flex-row items-stretch sm:items-start gap-4">
          <div class="flex-1 min-w-0 sm:flex-none sm:w-[280px]">
            <label for="subscribe" class="sr-only">{{ t.subscribe.label }}</label>
            <input id="subscribe" name="subscribe" type="email" autocomplete="email" required placeholder="{{ t.subscribe.placeholder }}" data-error="Enter your email address" data-error-type="Enter a valid email address" class="field subscribe-field">
          </div>
          <button type="submit" class="btn btn-solid sm:flex-none inline-flex items-center justify-center whitespace-nowrap min-h-[44px] px-6 py-[9px] font-bold white bg-ink rounded-3xl">
            <span data-label>{{ t.subscribe.button }}</span>
            <span class="btn-icon btn-icon-right pl-0.5">{% include icon.html icon="arrow-right" %}</span>
          </button>
        </div>
        <p id="subscribeForm-status" class="form-status mt-3" role="alert"></p>
      </form>
    </div>

    <div class="my-4 titolo" id="submitSubscribeForm" style="display: none;" aria-live="polite">
      <div class="flex-1 self-stretch flex flex-col justify-start items-start gap-6">
        {% include title.html caption=t.subscribe.thanks.caption title=t.subscribe.thanks.title dot="yes" align="center" %}
      </div>
      <div class="max-w-lg text-center self-stretch text-chocolate justify-start text-lg leading-loose">{{ t.subscribe.thanks_text }}</div>
    </div>
  </div>
</div>
