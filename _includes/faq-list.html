{% assign n = include.index %}
<div class="faq-item w-full flex-shrink-0 bg-white rounded-xl shadow-card hover:shadow-[0_4px_12px_rgba(0,0,0,0.12)] p-6 transition-shadow duration-300 bg-cream" :class="{ 'is-open': openFaq === {{ n }} }">
  <!-- Question -->
  <button
	id="faq-question-{{ n }}"
	aria-controls="faq-answer-{{ n }}"
	:aria-expanded="(openFaq === {{ n }}).toString()"
	@click="openFaq = (openFaq === {{ n }}) ? null : {{ n }}"
	class="flex justify-between items-center w-full text-left text-lg font-normal text-charcoal"
  >
	<span>{{ include.faq.question }}</span>

	<!-- Plus turns into a minus -->
	<span class="faq-icon relative w-5 h-5 flex-none flex items-center justify-center" aria-hidden="true">
	  <span class="faq-bar-h absolute w-4 h-[2px] bg-green"></span>
	  <span class="faq-bar-v absolute w-[2px] h-4 bg-green"></span>
	</span>
  </button>

  <!-- Answer: its height animates with CSS, so it matches the text however long it is -->
  <div id="faq-answer-{{ n }}" class="faq-panel" role="region" aria-labelledby="faq-question-{{ n }}" :class="{ 'is-open': openFaq === {{ n }} }">
	<div class="faq-panel-inner">
	  <div class="faq-answer mt-4 text-gray-700 text-base leading-relaxed">
		{{ include.faq.answer }}
	  </div>
	</div>
  </div>
</div>
